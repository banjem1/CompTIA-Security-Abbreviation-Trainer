const P={bg:'#060c18',s1:'#0b1624',s2:'#0f1f38',bdr:'#1a3456',
  acc:'#00d4ff',grn:'#00e676',red:'#ff5252',amb:'#ffb300',
  pur:'#a78bfa',tea:'#00bfa5',txt:'#b8d0ec',brt:'#e8f4ff',mut:'#3d5a7a',dim:'#1e3a5a'};
const CATS=['Access Control','Identity','Protocols','Cryptography','Network Security',
  'Threats','Incident Response','Cloud','Compliance','Hardware','Security Features'];
const CC=['#7c3aed','#2563eb','#0891b2','#059669','#e11d48',
  '#c2410c','#b45309','#6366f1','#0d9488','#64748b','#1d4ed8'];
const DOMS=['General Security Concepts','Threats & Vulnerabilities',
  'Security Architecture','Security Operations','Security Program Management'];
const DC=['#7c3aed','#e11d48','#0891b2','#059669','#b45309'];
const EXSRC=['A','B','C','Custom'];
const SS=20;
const TD=[
['AAA','Authentication, Authorization, and Accounting',0,'Enterprise framework: verifies WHO you are, WHAT you can access, and LOGS every action.','TACACS+ separates all 3 and encrypts entire packet. RADIUS combines auth/authorization and only encrypts password.'],
['ACL','Access Control List',0,'Permit/deny rules on firewall ports and file systems — top-down, first match wins.','Evaluated top-down, first match wins. On routers=packet filter. On file systems=implements DAC.'],
['DAC','Discretionary Access Control',0,'Resource OWNERS decide who accesses their files — standard Windows/Linux permission model.','Key word: OWNER controls access. Weakest model because compromised owner exposes all data.'],
['MAC','Mandatory Access Control',0,'Government security LABELS (Top Secret, Secret, Confidential) — OS decides, users cannot override.','Key word: LABELS. SELinux implements MAC. Most restrictive model. Users CANNOT override OS decisions.'],
['RBAC','Role-Based Access Control',0,'Access by job ROLE — adding an HR employee to the HR group grants all needed permissions.','Most tested model. Key phrase: least privilege by role. Behind Active Directory group membership.'],
['ABAC','Attribute-Based Access Control',0,'Access requires multiple simultaneous conditions: role AND device posture AND time of day.','Differs from RBAC by requiring multiple attributes. Three conditions = ABAC answer.'],
['NAC','Network Access Control',0,'Checks patch level and AV status before allowing network access — unhealthy devices quarantined.','802.1X enforces NAC at switch port. RADIUS is backend auth server. Posture assessment = NAC.'],
['IAM','Identity and Access Management',1,'Full user account lifecycle: provisioning, authentication, authorization, and deprovisioning.','Terminated employee still has access = IAM deprovisioning failure.'],
['IdP','Identity Provider',1,'Authenticates users and vouches for their identity to other apps — Okta, Azure AD, ADFS.','SAML questions: IdP sends assertions to Service Providers.'],
['SSO','Single Sign-On',1,'Authenticate once, access all connected systems without re-entering credentials.','Benefit: single auth. Risk: single point of failure. Kerberos implements SSO in Windows domains.'],
['MFA','Multi-Factor Authentication',1,'Two or more different credential types — stolen password alone cannot gain access.','Three factors: know (password), have (token), are (biometric). Two passwords = NOT MFA.'],
['OTP','One-Time Password',1,'Single-use code that expires immediately — intercepted OTP is already invalid.','TOTP: time-based 30 sec. HOTP: counter-based. Both prevent replay attacks.'],
['TOTP','Time-based One-Time Password',1,'6-digit code every 30 seconds generated offline by authenticator apps.','Generated offline, requires clock sync. TOTP=time-based; HOTP=event/counter-based.'],
['HOTP','HMAC-based One-Time Password',1,'New code each button press on hardware token — valid indefinitely until used.','Hardware token requiring button press=HOTP. TOTP expires by time; HOTP expires by use.'],
['FIDO','Fast Identity Online',1,'Credentials bound to an exact domain — phishing sites cannot capture them.','Domain-bound so phishing fails. FIDO2/WebAuthn is the strongest MFA option.'],
['PIV','Personal Identity Verification',1,'Smart card with PKI certificates for U.S. federal CIVILIAN employees — mandated by HSPD-12.','PIV=civilian federal. CAC=DoD military. Both require PIN (two-factor).'],
['CAC','Common Access Card',1,'DoD smart card with up to three X.509 certs for military login, email signing, facility access.','CAC=DoD military. PIV=civilian federal. For DoD questions answer CAC.'],
['PAP','Password Authentication Protocol',2,'Sends username and password in complete cleartext — oldest most insecure auth protocol.','PAP is ALWAYS the wrong answer. Cleartext credentials. Appears in \'which to AVOID\' questions.'],
['CHAP','Challenge Handshake Authentication Protocol',2,'Never transmits the password — server sends random challenge, client responds with hash.','Prevents replay attacks because challenge changes every time. MS-CHAPv2 is the Windows version.'],
['EAP','Extensible Authentication Protocol',2,'Framework for 802.1X wireless and VPN — supports many auth methods.','EAP is a FRAMEWORK not a protocol. EAP-TLS=most secure (mutual certs). PEAP tunnels inside TLS.'],
['RADIUS','Remote Authentication Dial-In User Service',2,'Authenticates enterprise Wi-Fi and VPN users, returns allow/deny, records accounting.','UDP 1812 auth, 1813 accounting. Encrypts only password. Better for network access.'],
['TACACS+','Terminal Access Controller Access-Control System Plus',2,'Encrypts entire session and logs every command admins run on routers and switches.','Encrypts entire packet vs RADIUS password-only. Best for Cisco device administration.'],
['SAML','Security Assertion Markup Language',2,'Corporate identity system vouches for users to external apps — one login grants Salesforce, Workday access.','Roles: IdP (authenticates), SP (resource), Subject (user). XML-based assertions.'],
['LDAP','Lightweight Directory Access Protocol',2,'Queries Active Directory for user accounts and group memberships.','Port 389 unencrypted. LDAPS port 636 over TLS. Intercepted directory queries = switch to LDAPS.'],
['IPSec','Internet Protocol Security',2,'Encrypts all IP traffic at Layer 3 — transparent tunnels between offices without app changes.','Transport mode: encrypts payload. Tunnel mode: encrypts entire packet. VPNs use Tunnel mode.'],
['ESP','Encapsulating Security Payload',2,'IPSec component providing both confidentiality AND integrity for packets.','ESP=encryption AND auth. AH=integrity only, no encryption. IP protocol number 50.'],
['AH','Authentication Header',2,'IPSec component proving packet integrity and authenticated origin — no encryption.','AH=integrity only, NO encryption. IP protocol 51. Rarely used alone since ESP provides both.'],
['IKE','Internet Key Exchange',2,'Negotiates Security Associations before IPSec can encrypt any traffic.','IKEv2 is faster, supports MOBIKE for mobile reconnection.'],
['SSL','Secure Sockets Layer',2,'Completely broken predecessor to TLS — POODLE exploits SSLv3, all versions must be replaced.','All SSL versions are broken. Never choose SSL as secure.'],
['TLS','Transport Layer Security',2,'Encrypts web, email, and VPN traffic — the protocol behind the browser padlock.','TLS 1.2 minimum (PCI DSS). TLS 1.3 current. TLS 1.3 removed RC4/DES/3DES, mandates PFS.'],
['HTTPS','Hypertext Transfer Protocol Secure',2,'HTTP over TLS port 443 — protects login credentials and form submissions from interception.','Padlock=TLS encrypted, NOT proof site is legitimate. HSTS forces HTTPS.'],
['SSH','Secure Shell',2,'Encrypted remote command-line access to Linux servers and network devices — replaces Telnet.','Port 22. Encrypts all session traffic. SSH tunneling can bypass firewall rules.'],
['SFTP','Secure File Transfer Protocol',2,'Transfers files securely over SSH — no exposure of credentials or file contents.','Runs over SSH port 22. Different from FTPS (FTP over TLS). Plain FTP is always wrong.'],
['FTP','File Transfer Protocol',2,'Transmits everything in cleartext — exposes usernames and passwords to any passive sniffer.','Always the wrong answer in security scenarios. Ports 20 data, 21 control.'],
['DNS','Domain Name System',2,'Translates domain names to IP addresses — targeted for poisoning attacks redirecting users.','Attacks: poisoning/spoofing, DDoS amplification, tunneling exfiltration. DNSSEC adds crypto.'],
['DHCP','Dynamic Host Configuration Protocol',2,'Auto-assigns IPs and gateway info to devices — rogue server can route all traffic through attacker.','Rogue DHCP assigns itself as default gateway=MITM. Defense: DHCP snooping. Ports 67 and 68.'],
['ARP','Address Resolution Protocol',2,'Maps IP to MAC addresses — no authentication, so false responses can redirect traffic.','ARP poisoning enables Layer 2 MITM. Defense: Dynamic ARP Inspection (DAI).'],
['ICMP','Internet Control Message Protocol',2,'Diagnostic protocol (ping, traceroute) — exploited for host discovery, DoS, and tunneling.','Ping sweeps use ICMP Echo Requests. ICMP floods are DoS. Block Echo Requests to prevent sweeps.'],
['SNMP','Simple Network Management Protocol',2,'Remote monitoring of routers and switches — v1/v2c use cleartext community strings.','SNMPv1/v2c cleartext defaults: public=read, private=write. SNMPv3 adds encryption and auth.'],
['NTP','Network Time Protocol',2,'Synchronizes clocks — Kerberos auth, cert validation, and log correlation depend on accurate time.','Kerberos fails if clocks differ by more than 5 minutes. NTP amplification used in DDoS.'],
['RDP','Remote Desktop Protocol',2,'Full graphical remote desktop control of Windows — most frequently brute-forced protocol.','Port 3389. Never expose directly to internet. Mitigations: VPN, NLA, strong passwords.'],
['WEP','Wired Equivalent Privacy',2,'Original Wi-Fi encryption completely broken in 2001 — cracked in minutes via IV analysis.','Always wrong answer. WEP uses RC4 with static keys and reuses IVs. Replace with WPA2 or WPA3.'],
['WPA','Wi-Fi Protected Access',2,'Wi-Fi security standard replacing WEP — WPA3 adds SAE preventing offline dictionary attacks.','WPA original used TKIP (deprecated). WPA2 CCMP/AES is minimum. WPA3 adds SAE.'],
['SMB','Server Message Block',2,'Windows file sharing — SMBv1 exploited by WannaCry/EternalBlue to spread across networks.','SMBv1 vulnerable to EternalBlue/WannaCry. Port 445. Disable SMBv1 to prevent lateral movement.'],
['AES','Advanced Encryption Standard',3,'Gold-standard symmetric encryption for Wi-Fi, disk encryption, and TLS — replaced DES.','Key lengths: 128, 192, 256 bits. AES-256 for Top Secret. GCM mode preferred.'],
['DES','Data Encryption Standard',3,'Original government cipher with 56-bit key publicly cracked in 1998 — historical weak key example.','56-bit key insufficient. Cracked 1998. Progression: DES broken, 3DES deprecated, AES current.'],
['3DES','Triple Data Encryption Standard',3,'Applied DES three times, deprecated by NIST 2023 — vulnerable to Sweet32 birthday attack.','Deprecated 2023. Sweet32 exploits 64-bit block size. Replace with AES for PCI DSS.'],
['RSA','Rivest Shamir Adleman',3,'Most deployed public-key algorithm — TLS key exchange, digital signatures, encrypting symmetric keys.','Used for key exchange and signatures, NOT bulk encryption (too slow). RSA-2048 minimum.'],
['ECC','Elliptic Curve Cryptography',3,'Equivalent RSA security with smaller keys — 256-bit ECC equals 3072-bit RSA strength.','Smaller keys, same security. ECDSA=signatures, ECDHE=key exchange with Perfect Forward Secrecy.'],
['ECDHE','Elliptic Curve Diffie-Hellman Ephemeral',3,'New key pair per TLS session — stolen server private key CANNOT decrypt previously recorded sessions.','ECDHE=Perfect Forward Secrecy. TLS 1.3 mandates ECDHE. Past sessions safe even if key compromised.'],
['SHA','Secure Hash Algorithm',3,'Fixed-length fingerprint that completely changes if one bit is altered — used for integrity.','SHA-1 broken (collisions). SHA-256 current standard. Use SHA-256 or higher for certificates.'],
['MD5','Message Digest 5',3,'128-bit hash vulnerable to collision attacks — two different inputs can produce the same hash.','Always wrong when security matters. Never use for passwords, certificates, or integrity.'],
['HMAC','Hash-based Message Authentication Code',3,'Hash combined with shared secret key — proves both integrity AND authenticity without PKI.','HMAC proves who sent AND message unchanged. Plain SHA-256 only proves unchanged.'],
['IV','Initialization Vector',3,'Random value added to encryption ensuring identical plaintexts produce different ciphertexts.','WEP reused IVs allowing keystream recovery. IVs must be unique per operation. AES-GCM uses nonce.'],
['PKI','Public Key Infrastructure',3,'System of CAs, certificates, and trust policies enabling verified public-key encryption.','Components: CA issues certs, RA verifies identity, CRL lists revoked certs, OCSP real-time.'],
['CA','Certificate Authority',3,'Issues and signs certificates binding a verified public key to a real-world identity.','Root CA: offline, top of hierarchy. Intermediate CA: issues end-entity certs.'],
['CRL','Certificate Revocation List',3,'Periodically published list of invalidated certificates — clients download and cache it.','CRL: not real-time, cached. A revoked cert may still be trusted during cache period.'],
['OCSP','Online Certificate Status Protocol',3,'Real-time certificate revocation checking — OCSP Stapling includes response in TLS handshake.','OCSP Stapling=fastest revocation check. Server pre-fetches and includes in handshake.'],
['HSM','Hardware Security Module',3,'Tamper-resistant hardware that generates and stores crypto keys — keys never leave in plaintext.','CA root keys, payment PIN encryption stored in HSMs. FIPS 140-2 Level 3 certification.'],
['TPM','Trusted Platform Module',3,'Security chip in laptops storing encryption keys and boot integrity measurements — BitLocker uses it.','TPM seals keys to boot state. If system tampered, key not released.'],
['DMZ','Demilitarized Zone',4,'Network zone hosting public-facing servers — compromised DMZ still faces inner firewall.','Web and email servers go in DMZ not internal LAN. Two firewalls or three-legged firewall.'],
['VLAN','Virtual Local Area Network',4,'Logically separates traffic on shared physical switches — isolates guest Wi-Fi and IoT.','VLANs limit lateral movement and reduce broadcast domains. VLAN hopping exploits trunk ports.'],
['VPN','Virtual Private Network',4,'Encrypted tunnel over public internet connecting remote employees or offices.','Site-to-site uses IPSec. Remote access uses SSL/TLS or IPSec. Split tunneling risk.'],
['WAF','Web Application Firewall',4,'Inspects HTTP/HTTPS to block SQLi, XSS, CSRF — attacks traditional firewalls cannot stop.','WAF operates at Layer 7. Traditional firewall cannot stop application layer attacks.'],
['IDS','Intrusion Detection System',4,'Passive monitoring that detects and ALERTS on suspicious patterns — cannot block traffic.','IDS detects and alerts only. IPS detects and blocks. IDS is passive (out-of-band).'],
['IPS','Intrusion Prevention System',4,'Inline active prevention that automatically DROPS malicious packets.','IPS is inline and blocks. False positives can block legit traffic. IPS at warehouse = Detective control.'],
['NAT','Network Address Translation',4,'Translates private IPs to public IPs — hides internal topology, enables device sharing.','Hides RFC 1918 addresses (10.x, 172.16-31.x, 192.168.x). PAT is most common variant.'],
['DDoS','Distributed Denial of Service',5,'Hundreds of compromised systems flood a target exhausting bandwidth or application capacity.','Types: volumetric (UDP/ICMP floods), protocol (SYN floods), application (HTTP floods).'],
['MITM','Man-in-the-Middle',5,'Adversary secretly intercepts all communications — enables credential theft and data manipulation.','Methods: ARP poisoning, rogue Wi-Fi APs, SSL stripping. Defenses: TLS pinning, HSTS, DAI.'],
['APT','Advanced Persistent Threat',5,'Long-term nation-state attack with high sophistication and persistence measured in months or years.','APT=nation-state, high resources, specific targets, long persistence.'],
['XSS','Cross-Site Scripting',5,'Malicious JavaScript injected into web pages executing in visitors browsers to steal cookies.','Stored XSS: in database affects all visitors. Reflected XSS: in URL. DOM-based: client-side.'],
['CSRF','Cross-Site Request Forgery',5,'Tricks authenticated user browser into making unauthorized requests using valid session cookies.','Prevention: CSRF tokens, SameSite cookie, check Origin/Referer. CSRF=forced action, XSS=script injection.'],
['SQLi','SQL Injection',5,'Malicious SQL through unsanitized input — bypasses authentication or extracts entire databases.','Prevention: parameterized queries (prepared statements). Secondary: WAF, input validation.'],
['CVE','Common Vulnerabilities and Exposures',5,'Standardized vulnerability identifier — format CVE-YEAR-NUMBER maintained by MITRE/CISA.','CVEs enable tracking and correlation across scanners and patch management systems.'],
['CVSS','Common Vulnerability Scoring System',5,'Severity score 0-10 based on exploitability and impact — standardizes vulnerability prioritization.','Critical 9-10, High 7-8.9, Medium 4-6.9, Low 0.1-3.9.'],
['IoC','Indicator of Compromise',5,'Digital evidence system was compromised — IP addresses, file hashes, domain names, registry keys.','Shared via STIX/TAXII. IoCs change frequently. TTPs change slowly more durable intelligence.'],
['TTPs','Tactics Techniques and Procedures',5,'Attacker goals, methods, and specific implementations — behavioral intelligence more durable than IoCs.','MITRE ATT&CK framework. Tactics=why. Techniques=how. Procedures=specific implementation.'],
['OSINT','Open-Source Intelligence',5,'Intelligence from publicly available sources without touching target systems.','Passive reconnaissance. Reading social media posts about a target = OSINT.'],
['IR','Incident Response',6,'Structured process for detecting, containing, investigating, and recovering from incidents.','NIST lifecycle: Preparation, Detection, Containment, Eradication, Recovery, Lessons Learned.'],
['SIEM','Security Information and Event Management',6,'Aggregates and correlates logs from across the network to detect multi-stage attacks.','Collects, normalizes, correlates, alerts. Detects attacks spanning multiple systems.'],
['EDR','Endpoint Detection and Response',6,'Continuous endpoint recording enabling real-time threat detection and remote isolation.','Behavioral analysis, continuous telemetry, active response. XDR adds network and cloud.'],
['DRP','Disaster Recovery Plan',6,'Specifies how IT systems will be restored after a disaster with step-by-step procedures.','DRP=IT recovery. BCP=all business functions. Must be tested via tabletop and failover.'],
['BCP','Business Continuity Plan',6,'Keeps essential business functions operating during disruptions — alternate locations, communication plans.','BCP broader than DRP. Building fire forces remote work=BCP. Identifies Maximum Tolerable Downtime.'],
['RTO','Recovery Time Objective',6,'Maximum acceptable time between system failure and full service restoration.','4-hour RTO=warm standby. 15-min RTO=hot standby. RTO=time to recover. RPO=data loss tolerance.'],
['RPO','Recovery Point Objective',6,'Maximum data loss a business can tolerate expressed as time — 4-hour RPO requires backups every 4 hours.','RPO=max age of recoverable data. System fails at 3pm with 4-hour RPO: oldest restore=11am.'],
['SOC','Security Operations Center',6,'Team monitoring security 24/7 — Tier 1 triages alerts, Tier 2 investigates, Tier 3 hunts threats.','Tier 1: triage. Tier 2: investigate. Tier 3: threat hunt and major incidents.'],
['FIM','File Integrity Monitoring',6,'Detects unauthorized file changes by comparing cryptographic hashes to baselines.','PCI DSS Requirement 11.5 mandates FIM on payment systems.'],
['IaaS','Infrastructure as a Service',7,'Provider manages hardware/hypervisors — customer responsible for OS patching, app security, and data.','Customer owns: OS, middleware, applications, data. Provider owns: hardware and hypervisor. EC2=IaaS.'],
['PaaS','Platform as a Service',7,'Provider manages OS, middleware, runtime — customer deploys only application code.','Customer owns: app code and data only. Provider owns: OS, middleware, runtime. Heroku=PaaS.'],
['SaaS','Software as a Service',7,'Provider manages everything — customer responsible only for user access and data governance.','Least customer responsibility. Customer owns: IAM, MFA, data classification.'],
['CASB','Cloud Access Security Broker',7,'Enforces security policies between users and cloud services — blocks shadow IT, applies DLP.','Blocks personal Dropbox/Drive (shadow IT). Modes: inline proxy or API-based.'],
['PCI DSS','Payment Card Industry Data Security Standard',8,'Mandatory standard for any org storing, processing, or transmitting payment card data.','Key requirements: firewall between internet and cardholder data, no default passwords, TLS for transmission.'],
['PII','Personally Identifiable Information',8,'Any data identifying a specific individual — SSN, address, email — breaches trigger notification laws.','GDPR governs EU PII. CCPA governs California. Health-related PII=PHI under HIPAA.'],
['PHI','Protected Health Information',8,'Health information linked to patient identifier regulated by HIPAA — requires BAA for vendor access.','PHI=health info+individual identifier. BAA required when vendor handles PHI.'],
['NIST','National Institute of Standards and Technology',8,'U.S. standards body — CSF five functions: Identify, Protect, Detect, Respond, Recover.','CSF: Identify=assets, Protect=safeguards, Detect=monitoring, Respond=IR, Recover=recovery.'],
['DLP','Data Loss Prevention',8,'Monitors data movement and blocks unauthorized transfer of SSNs, credit cards, PHI externally.','DLP inspects content for patterns, can block/quarantine/alert. Types: network, endpoint, cloud.'],
['BYOD','Bring Your Own Device',8,'Policy allowing personal devices for work — requires MDM or containerization to separate data.','MDM=full device. MAM=only corporate apps. Containerization=separates data.'],
['BIOS','Basic Input Output System',9,'Firmware initializing hardware before OS loads — target for persistent bootkits surviving reinstallation.','BIOS password prevents unauthorized config changes. UEFI replaced BIOS and adds Secure Boot.'],
['UEFI','Unified Extensible Firmware Interface',9,'Modern BIOS replacement with Secure Boot — verifies bootloader signatures to prevent rootkits.','Secure Boot verifies signed bootloader. Prevents booting from malicious USB.'],
['RAID','Redundant Array of Independent Disks',9,'Combines multiple drives for redundancy or performance — RAID is NOT a backup.','Levels: 0 striping, 1 mirroring, 5 parity (lose 1), 6 (lose 2), 10 mirroring+striping.'],
['ICS','Industrial Control System',9,'Monitors and controls industrial processes — legacy protocols lack authentication, cannot be easily patched.','ICS: cannot patch, safety overrides security, Modbus/DNP3 no auth. Purdue Model separates IT/OT.'],
['SCADA','Supervisory Control and Data Acquisition',9,'Supervisory layer managing power grids, water systems, pipelines — high-value attack targets.','SCADA controls critical infrastructure. Protocols lack authentication.'],
['IoT','Internet of Things',9,'Internet-connected devices with minimal security — default credentials, no patch mechanism.','Mirai botnet exploited IoT default credentials for DDoS. Mitigation: IoT VLAN, change credentials.'],
['DEP','Data Execution Prevention',10,'OS marks memory executable or non-executable — prevents shellcode injection via buffer overflow.','Implemented in hardware NX/XD bit, enforced by OS. Works alongside ASLR.'],
['FDE','Full Disk Encryption',10,'Encrypts entire storage drive — protects data on stolen laptops even if drive physically removed.','BitLocker on Windows, FileVault on macOS. FDE keys stored in TPM.'],
['GPO','Group Policy Object',10,'Centrally pushes security settings to all Windows domain computers — password policy, USB restrictions.','Any org-wide Windows security config=GPO. Linked to AD OUs to enforce settings.'],
['SPF','Sender Policy Framework',10,'DNS TXT record listing authorized mail servers — receiving servers check to detect spoofed senders.','SPF+DKIM+DMARC=complete email authentication. SPF alone does not specify disposition policy.'],
['DKIM','DomainKeys Identified Mail',10,'Cryptographic signature on emails verifying they came from the authorized sending server.','Check the DKIM record to verify digital signature from external email server.'],
['DMARC','Domain-based Message Authentication Reporting and Conformance',10,'Email policy that specifies what to do when SPF or DKIM checks fail — accept, quarantine, or reject.','DMARC determines DISPOSITION of unauthorized email. SPF and DKIM alone do not define policy.'],
['SASE','Secure Access Service Edge',10,'Combines WAN connectivity with cloud-native security — ideal for mobile workers accessing cloud apps.','SASE = network + security as cloud service. Answer when mobile field workers need cloud app access.'],
['RTOS','Real-Time Operating System',10,'OS designed for applications requiring guaranteed response times with no delays.','RTOS is the answer when instant response or zero delay is required (radar, industrial control).'],
['SLE','Single Loss Expectancy',10,'Monetary value of a single loss event — the cost if one occurrence of a risk materializes.','SLE x ARO = ALE (Annual Loss Expectancy). SLE=one event cost.'],
['ALE','Annual Loss Expectancy',10,'Expected yearly loss from a risk — calculated as SLE multiplied by ARO.','ALE = SLE x ARO. Drives security investment decisions based on cost vs risk.'],
['ARO','Annual Rate of Occurrence',10,'How many times a specific risk event is expected to occur in one year.','Estimated laptops stolen per year = ARO. ARO x SLE = ALE.'],
];
const TERMS=TD.map(([a,f,c,r,e],id)=>({abbr:a,full:f,cat:c,real:r,exam:e,id,box:0,seen:0,pm:{fc:{a:0,c:0},ch:{a:0,c:0},ty:{a:0,c:0}}}));
const QD=[
['A company has hired a third-party to gather information about the company\'s servers and data. This third-party will not have direct access to the company\'s internal network, but they can gather information from any other source. Which would BEST describe this approach?',['Vulnerability scanning','Passive reconnaissance','Supply chain analysis','Regulatory audit'],1,1,'Passive reconnaissance focuses on gathering information from open sources such as social media, corporate websites, and business organizations without any direct system access. Vulnerability scanning requires direct system access. Supply chain analysis examines vendor security. A regulatory audit requires access to internal systems.','A'],
['A company\'s email server has received an email from a third-party, but the origination server does not match the list of authorized devices. Which of the following would determine the disposition of this message?',['SPF','NAC','DMARC','DKIM'],2,3,'DMARC (Domain-based Message Authentication Reporting and Conformance) is used to specify the policy and determine the disposition of messages that fail SPF or DKIM checks. The disposition can be to accept, quarantine, or reject the message. SPF and DKIM don\'t determine policy. NAC controls network access, not email.','A'],
['Which of these threat actors would be MOST likely to attack systems for direct financial gain?',['Organized crime','Hacktivist','Nation state','Shadow IT'],0,1,'Organized crime actors are primarily motivated by financial gain through activities like ransomware, theft, and fraud. Hacktivists are politically motivated. Nation states are well-funded but focused on espionage. Shadow IT describes unauthorized technology use within an organization, not a threat actor.','A'],
['A security administrator has examined a server recently compromised by an attacker, and has determined the system was exploited due to a known operating system vulnerability. Which would BEST describe this finding?',['Root cause analysis','E-discovery','Risk appetite','Data subject'],0,1,'Root cause analysis identifies the underlying cause of an issue. Discovering that the OS vulnerability was the root cause explains why the system was compromised. E-discovery relates to legal electronic document gathering. Risk appetite describes how much risk an organization accepts. Data subject describes a person whose data is processed.','A'],
['A city is building an ambulance service network for emergency medical dispatching. Which of the following should have the highest priority?',['Integration costs','Patch availability','System availability','Power usage'],2,4,'System availability must be the highest priority for emergency services. If the ambulance dispatch network is unavailable, lives could be lost. Integration costs, patch availability, and power usage are all secondary considerations compared to keeping the system operational at all times.','A'],
['A system administrator receives a text alert when access rights are changed on a database containing private customer information. Which would describe this alert?',['Maintenance window','Attestation and acknowledgment','Automation','External audit'],2,3,'Automation describes systems that automatically respond to events without human intervention. The system automatically detected the access rights change and sent an alert. A maintenance window is scheduled downtime. Attestation involves formal verification. An external audit is performed by third parties.','A'],
['A security administrator is concerned about the potential for data exfiltration using external storage drives. Which would be the BEST way to prevent this?',['Create an OS security policy to block removable media','Monitor removable media usage in host-based firewall logs','Only allow applications that do not use removable media','Define a removable media block rule in the UTM'],0,3,'Creating an OS security policy (such as a Windows Group Policy) is the most direct and effective way to prevent the use of removable media. Monitoring logs detects use but doesn\'t prevent it. Restricting applications isn\'t practical. A UTM rule manages network traffic, not physical media.','A'],
['A company creates a standard set of government reports each calendar quarter. Which would describe this type of data?',['Data in use','Obfuscated','Trade secrets','Regulated'],3,4,'Government compliance reports are considered regulated data because they must be created and maintained according to specific laws and regulations. Data in use describes data being actively accessed. Obfuscated data has been deliberately hidden. Trade secrets are proprietary business information.','A'],
['A security engineer is viewing this firewall log: UTC 04/05/2023 03:09:15 - AV Gateway Alert - 136.127.92.171:80 -> 10.16.10.14:60818 - XPACK.A_7854 (Trojan) blocked. Which can be observed from this log?',['The victim IP address is 136.127.92.171','A download was blocked from a web server','A botnet DDoS attack was blocked','The Trojan was blocked but the file was not'],1,3,'The log shows traffic FROM the external IP (136.127.92.171) on port 80 (web server port) TO the internal IP. A Trojan was detected and blocked by the AV Gateway, meaning a download from a web server was prevented. The internal IP (10.16.10.14) is the potential victim, not the external IP.','A'],
['A user connects to a third-party website and receives: \'Your connection is not private. NET::ERR_CERT_INVALID.\' Which attack would be the MOST likely reason for this message?',['Brute force','DoS','On-path','Deauthentication'],2,1,'An on-path attack (formerly man-in-the-middle) involves an attacker inserting themselves between the client and server. The attacker\'s certificate would not match the expected server certificate, causing the browser to display a certificate error. Brute force attacks credentials. DoS disrupts availability. Deauthentication is a wireless attack.','A'],
['Which of the following would be the BEST way to provide a website login using existing credentials from a third-party site?',['Federation','802.1X','EAP','SSO'],0,3,'Federation allows users to log into one system using credentials from a trusted third-party identity provider (like \'Login with Google\'). 802.1X is for network access control. EAP is an authentication framework for wireless networks. SSO allows single authentication but for systems within the same organization.','A'],
['A system administrator is working on a contract that will specify minimum required uptime for Internet-facing firewalls. The administrator needs to know how often the firewall hardware is expected to fail between repairs. Which would BEST describe this?',['MTBF','RTO','MTTR','RPO'],0,3,'MTBF (Mean Time Between Failures) describes how long hardware operates before failing. This is the uptime metric needed for the contract. RTO is the recovery time objective after a failure occurs. MTTR is the time to repair after failure. RPO is the data loss tolerance.','A'],
['An attacker calls into a company\'s help desk and pretends to be the director of the company\'s manufacturing plant. The attacker asks for an immediate password reset. Which would BEST describe this attack?',['Social engineering','Supply chain','Watering hole','On-path'],0,1,'Social engineering manipulates people into taking actions or revealing information. Pretending to be an authority figure to get a password reset is classic social engineering (specifically pretexting). Supply chain attacks target vendors. Watering hole attacks compromise websites visitors frequent. On-path attacks intercept communications.','A'],
['Two companies have been working together for a number of months and would like to formalize the arrangement with a broad agreement between the organizations. Which would describe this agreement?',['SLA','NDA','MOA','SOW'],2,4,'An MOA (Memorandum of Agreement) is a formal written agreement between two organizations documenting a mutual arrangement. An SLA specifies performance requirements. An NDA protects confidential information disclosure. An SOW details specific tasks to be performed.','A'],
['An attacker has sent more information than expected in a single API call, which has allowed execution of additional code on a server. Which would BEST describe this attack?',['Memory injection','Replay attack','Cross-site scripting','Buffer overflow'],3,1,'A buffer overflow occurs when more data is sent than the allocated memory buffer can hold, allowing an attacker to overwrite adjacent memory and potentially execute arbitrary code. Memory injection is a different technique. A replay attack reuses captured data. XSS injects scripts into web pages.','A'],
['A company encourages users to encrypt all of their confidential materials on a central server and would like to enable key escrow as a backup option. Which key should be placed into escrow?',['Private','CA','Session','Public'],0,0,'Key escrow requires storing a copy of the private key so encrypted data can be recovered if the key is lost. The private key is used to decrypt data encrypted with the corresponding public key. CA keys are used to sign certificates. Session keys are temporary. Public keys are freely distributed.','A'],
['A manufacturing company would like to use an existing router to separate a corporate network from a manufacturing floor. Both networks use the same physical switch, and no additional hardware should be installed. Which would be the BEST choice?',['Connect networks with a VPN','Build an air gapped manufacturing floor network','Use host-based firewalls on each device','Create separate VLANs'],3,2,'VLANs (Virtual Local Area Networks) logically separate traffic on shared physical infrastructure without requiring additional hardware. A VPN is for remote access over untrusted networks. An air gap would require additional hardware. Host-based firewalls protect individual hosts but don\'t segment the network.','A'],
['An organization needs to provide a remote access solution for a newly deployed cloud-based application designed for mobile field service technicians. Which would be the best option?',['RTOS','CRL','Zero-trust','SASE'],3,2,'SASE (Secure Access Service Edge) combines WAN connectivity with cloud-native security services, making it ideal for mobile workers accessing cloud applications from various locations. RTOS is a real-time operating system for time-critical applications. CRL is for certificate revocation. Zero-trust is a security model, not a remote access solution.','A'],
['A recent report shows the return of a vulnerability that was previously patched four months ago. A recent patch has reintroduced this vulnerability. Which should be implemented to prevent this?',['Containerization','Data masking','802.1X','Change management'],3,4,'Change management processes require testing patches in a non-production environment before deployment to prevent issues like reintroducing vulnerabilities. Containerization isolates applications. Data masking protects sensitive data. 802.1X provides network access control.','A'],
['A security manager would like to ensure that unique hashes are used with an application login process. Which would be the BEST way to add random data when generating stored password hashes?',['Salting','Obfuscation','Key stretching','Digital signature'],0,0,'Salting adds a unique random value to each password before hashing, ensuring that identical passwords produce different hash values. This prevents rainbow table attacks. Obfuscation makes code harder to read. Key stretching makes hashing computationally expensive. Digital signatures provide authentication.','A'],
['Which cryptographic method is used to add trust to a digital certificate?',['Steganography','Hash','Symmetric encryption','Digital signature'],3,0,'A digital signature is applied to a digital certificate by the Certificate Authority, establishing trust by proving the certificate was issued by a trusted entity. Steganography hides information in media. A hash verifies integrity but doesn\'t establish trust. Symmetric encryption uses shared keys.','A'],
['An organization maintains a large database of customer information for sales tracking. Which role in the organization would be responsible for managing the access rights to this data?',['Data processor','Data owner','Data subject','Data custodian'],3,3,'The data custodian is responsible for the day-to-day management and protection of data, including managing access rights and backups. The data owner defines who should have access. The data processor processes data on behalf of the owner. The data subject is the person whose data is stored.','A'],
['A security manager would like to find which servers have the most critical vulnerabilities. The manager would like to rank the servers by the severity of the vulnerabilities. Which would be the BEST way to accomplish this?',['Perform a credentialed vulnerability scan','Perform passive reconnaissance','Conduct an internal audit','Install a SIEM'],0,3,'A credentialed vulnerability scan logs into systems with valid credentials to perform a thorough assessment, identifying all vulnerabilities including those requiring authentication. Passive reconnaissance gathers public information. An internal audit assesses policy compliance. A SIEM aggregates and correlates logs.','A'],
['Which describes a monetary loss if ONE single event occurs?',['ALE','SLE','RTO','ARO'],1,4,'SLE (Single Loss Expectancy) represents the monetary loss from a single occurrence of a risk event. ALE (Annual Loss Expectancy) = SLE x ARO. RTO is the recovery time objective. ARO is the annual rate of occurrence (how often the event is expected per year).','A'],
['A security administrator has performed an audit of organization production web servers, and results identified default configurations, web services running from a privileged account, and inconsistencies with SSL certificates. Which would be the BEST way to resolve these issues?',['Server hardening','Multi-factor authentication','Enable HTTPS','Run OS updates'],0,2,'Server hardening addresses all identified issues at once by removing defaults, restricting service accounts to least privilege, and correcting certificate configurations. MFA adds authentication layers but doesn\'t fix server configuration. Enabling HTTPS addresses only the certificate issue. OS updates address patches but not default configurations.','B'],
['A shipping company stores information in small regional warehouses around the country. The company maintains an IPS at each warehouse to watch for suspicious traffic patterns. Which security control type is this?',['Deterrent','Compensating','Directive','Detective'],3,0,'An IPS (Intrusion Prevention System) used to watch for suspicious patterns is functioning as a detective control — it identifies and logs potential threats. While an IPS can also be preventive, in this context it is watching and detecting patterns at each warehouse location.','B'],
['The Vice President of Sales has asked the IT team to create daily backups of the sales data. The Vice President is an example of which role?',['Data owner','Data controller','Data steward','Data processor'],0,3,'A data owner is responsible for the business asset and determines who should have access and what protection is required. The VP of Sales owns the sales data and is directing its protection. A data controller determines how data is processed. A data steward manages data quality. A data processor handles data on behalf of others.','B'],
['A security engineer is preparing to conduct a penetration test of a third-party website. Part of the preparation involves reading through social media posts for information about this site. Which describes this practice?',['Partially known environment','OSINT','Exfiltration','Active reconnaissance'],1,1,'OSINT (Open-Source Intelligence) is the practice of gathering information from publicly available sources including social media. This is a passive technique that doesn\'t involve directly accessing target systems. Active reconnaissance involves direct interaction with target systems.','B'],
['A user in the accounting department has received a text message from the CEO requesting payment by cryptocurrency for a recently purchased tablet. Which would BEST describe this attack?',['Brand impersonation','Watering hole attack','Smishing','Typosquatting'],2,1,'Smishing (SMS phishing) is a social engineering attack conducted via text message. The attacker impersonated the CEO via text message to manipulate the accounting employee. Brand impersonation is a broader category. Watering hole attacks compromise websites. Typosquatting uses misspelled domain names.','B'],
['A company has been informed of a hypervisor vulnerability that could allow users on one virtual machine to access resources on another virtual machine. Which would BEST describe this vulnerability?',['Containerization','Jailbreaking','SDN','Escape'],3,1,'A VM escape vulnerability allows an attacker on one virtual machine to break out of the VM isolation and access resources on the hypervisor or other VMs. Containerization is a deployment technology. Jailbreaking removes mobile OS restrictions. SDN is a networking architecture.','B'],
['While working from home, users attending a web conference type in the meeting link but the browser is directed to a different website. Office users have no issues. Which would be the MOST likely reason?',['Buffer overflow','Wireless disassociation','Amplified DDoS','DNS poisoning'],3,1,'DNS poisoning corrupts the DNS cache on home routers or local DNS servers, redirecting specific domain names to malicious IP addresses. Since office users use a different DNS server, they are unaffected. Buffer overflows target application memory. Wireless disassociation affects Wi-Fi connectivity. Amplified DDoS overwhelms target bandwidth.','B'],
['A company is launching a new internal application that will not start until a username, password, and smart card is present. Which BEST describes this process?',['Federation','Accounting','Authentication','Authorization'],2,0,'Authentication is the process of verifying the identity of a user before granting access. Requiring a username, password, and smart card together constitutes multi-factor authentication. Federation allows using third-party credentials. Accounting tracks user actions. Authorization determines what authenticated users can access.','B'],
['An online retailer is planning a penetration test. A third-party organization will perform the test and has been provided only the Internet-facing IP addresses for public web servers. No other details were provided. What penetration testing methodology is being used?',['Known environment','Passive reconnaissance','Partially known environment','Benchmarks'],2,4,'A partially known environment (gray box) test is when the tester has some but not all information about the target. Being given only IP addresses represents partial knowledge. A known environment (white box) provides full system details. An unknown environment (black box) provides nothing. Passive reconnaissance is a technique, not an environment type.','B'],
['Which of the following would be the BEST way for an organization to verify the digital signature provided by an external email server?',['Perform a vulnerability scan','View the server device certificate','Authenticate to a RADIUS server','Check the DKIM record'],3,3,'DKIM (DomainKeys Identified Mail) provides digital signatures for email messages. Checking the DKIM record in DNS allows verification of the digital signature on emails from an external server. A vulnerability scan tests for weaknesses. A device certificate authenticates the server. RADIUS handles network authentication.','B'],
['A company is using older operating systems for their web servers and is concerned about stability during periods of high use. Which should be used to maximize uptime and availability?',['Cold site','UPS','Redundant routers','Load balancer'],3,2,'A load balancer distributes traffic across multiple servers to prevent any single server from being overwhelmed, maximizing uptime and availability during high-use periods. A cold site is for disaster recovery. A UPS provides power backup. Redundant routers provide network path redundancy but don\'t help with server load.','B'],
['A user in the accounting department would like to email a spreadsheet with sensitive information to a list of third-party vendors. Which would be the BEST way to protect the data in this email?',['Full disk encryption','Key exchange algorithm','Salted hash','Asymmetric encryption'],3,0,'Asymmetric encryption (public key encryption) is used to protect data in transit such as email. The sender encrypts with the recipient\'s public key, and only the recipient\'s private key can decrypt it. Full disk encryption protects data at rest. Key exchange is for establishing symmetric keys. A salted hash is a one-way function for passwords, not reversible encryption.','B'],
['A system administrator would like to segment the network to give the marketing, accounting, and manufacturing departments their own private network with restricted communication between departments. Which should be configured?',['VPN','RBAC','VLAN','SDN'],2,2,'VLANs (Virtual Local Area Networks) logically separate network traffic on shared physical infrastructure, allowing each department to have its own private network segment. A VPN is for remote access. RBAC controls user access permissions. SDN is a networking architecture for centralized control.','B'],
['A technician at an MSP has been asked to manage devices on a third-party private network. The technician needs command line access to internal routers, switches, and firewalls. Which would provide the necessary access?',['HSM','Jump server','NAC','Air gap'],1,3,'A jump server (jump box) is a secure computer that allows administrators to connect to and manage systems in a different security zone. It provides a controlled entry point for accessing internal network devices like routers and switches. An HSM stores cryptographic keys. NAC controls network access. An air gap physically isolates systems.','B'],
['A transportation company is installing new wireless access points. The manufacturer estimates they will operate an average of 100,000 hours before a hardware-related outage. Which describes this estimate?',['MTTR','RPO','RTO','MTBF'],3,3,'MTBF (Mean Time Between Failures) describes the average time a hardware device operates before experiencing a failure. This is the standard metric for hardware reliability estimates. MTTR is the average time to repair after failure. RPO is the data loss tolerance. RTO is the recovery time objective.','B'],
['A security administrator is creating a policy to prevent the disclosure of credit card numbers in a customer support application. Users would only be able to view the last four digits. Which would provide this functionality?',['Hashing','Tokenization','Masking','Salting'],2,0,'Masking replaces sensitive data with a non-sensitive substitute while maintaining the format. Showing only the last four digits of a credit card is data masking. Hashing is a one-way function used for verification. Tokenization replaces sensitive data with a surrogate token. Salting adds random data to hashes.','B'],
['A user is authenticating using a PIN and a fingerprint. Which describes these authentication factors?',['Something you know, something you are','Something you are, somewhere you are','Something you have, something you know','Somewhere you are, something you are'],0,0,'A PIN is \'something you know\' (knowledge factor). A fingerprint is \'something you are\' (biometric/inherence factor). Together they constitute multi-factor authentication using two different factor categories. This is distinct from combining two knowledge factors (which would be single-factor).','B'],
['A security administrator is configuring authentication for technicians logging into wireless access points and switches. Instead of local accounts, all login requests should pass to a centralized database. Which would be the BEST way to implement this?',['COPE','AAA','IPsec','SIEM'],1,3,'AAA (Authentication, Authorization, and Accounting) with a RADIUS server provides centralized authentication for network devices. All login requests are forwarded to the central AAA server rather than using local accounts. COPE is a mobile device policy. IPsec provides VPN tunnels. SIEM aggregates security logs.','B'],
['A recent audit determined that many IT department accounts have been granted Administrator access. The audit recommends replacing these with limited access rights. Which policy does this describe?',['Password vaulting','Offboarding','Least privilege','Discretionary access control'],2,3,'Least privilege is the security principle of providing users only the minimum access rights needed to perform their job functions. Replacing administrator access with limited rights directly implements least privilege. Password vaulting secures passwords. Offboarding removes access when employees leave. DAC lets owners control access.','B'],
['A recent security audit discovered email addresses and passwords located in a packet capture. Which did the audit identify?',['Weak encryption','Improper patch management','Insecure protocols','Open ports'],2,1,'Insecure protocols transmit data in cleartext, making it susceptible to capture by packet analyzers. Finding credentials in a packet capture indicates a protocol that doesn\'t encrypt traffic (like HTTP, FTP, or Telnet). Weak encryption would scramble but potentially crack the data. Patch management and open ports are different issues.','B'],
['Before deploying a new application, a company is performing an internal audit to ensure servers are configured with appropriate security features. Which would BEST describe this process?',['Due care','Active reconnaissance','Data retention','Statement of work'],0,4,'Due care demonstrates that an organization is taking reasonable precautions and steps to protect its systems and data. Performing security audits before deployment is a form of due diligence and due care. Active reconnaissance involves probing systems for vulnerabilities. Data retention defines how long data is kept. A SOW defines project tasks.','B'],
['An organization has cancelled insurance policies for ransomware and decided to address potential ransomware issues internally. Which best describes this action?',['Mitigation','Acceptance','Transference','Risk-avoidance'],1,4,'Acceptance (or risk acceptance) means the organization acknowledges the risk exists and decides to absorb the potential loss without external coverage. Cancelling insurance and handling issues internally accepts the risk. Mitigation reduces risk probability or impact. Transference shifts risk to a third party (like insurance). Risk avoidance eliminates the risk entirely.','B'],
['An organization developed an in-house mobile app and would like it to identify revoked server certificates without sending traffic over the corporate internet connection. Which must be configured?',['CSR generation','OCSP stapling','Key escrow','Wildcard'],1,0,'OCSP stapling allows the server to include a pre-fetched, CA-signed revocation status in the TLS handshake. The client receives the revocation status directly from the server during the handshake without making a separate OCSP request over the internet connection. CSR generates certificate requests. Key escrow stores private keys. Wildcard covers subdomains.','B'],
['A security administrator has been asked to build a network link to secure all communication between two remote locations. Which would be the best choice?',['SCAP','Screened subnet','IPsec','Network access control'],2,2,'IPsec is specifically designed to create encrypted tunnels between remote locations, providing confidentiality, integrity, and authentication for all traffic traversing the link. SCAP is for security automation. A screened subnet (DMZ) separates public-facing servers. NAC controls endpoint access to the network.','B'],
['A Linux administrator views a disk showing: /dev/xvda1 - Size 158G, Used 158G, Avail 0, Use% 100%. Which would BEST describe this information?',['Buffer overflow','Resource consumption','SQL injection','Race condition'],1,1,'Resource consumption occurs when a system exhausts available resources such as disk space. The disk is completely full (100% usage, 0 available) which would cause database response issues. A buffer overflow overwrites memory. SQL injection attacks databases. A race condition occurs when processes compete for resources in an unexpected order.','B'],
['Which can be used for credit card transactions from a mobile device without sending the actual credit card number across the network?',['Tokenization','Hashing','Steganography','Masking'],0,0,'Tokenization replaces sensitive data like credit card numbers with a non-sensitive surrogate value (token) that can be used for the transaction. The actual credit card number never traverses the network. Hashing is one-way and not reversible for transactions. Steganography hides data in other media. Masking displays partial data.','B'],
['A company is accepting proposals for an upcoming project, and one of the responses is from a business owned by a board member. Which describes this situation?',['Due diligence','Vendor monitoring','Conflict of interest','Right-to-audit'],2,4,'A conflict of interest occurs when a person\'s private interests could improperly influence their professional decisions. A board member\'s business submitting a proposal for work creates a potential conflict of interest in the evaluation process. Due diligence is thorough investigation. Vendor monitoring tracks vendor performance. Right-to-audit permits security assessments.','B'],
['A company has rolled out a new application that requires a hardware-based token generator. Which BEST describes this access feature?',['Something you know','Somewhere you are','Something you are','Something you have'],3,0,'A hardware-based token generator is a physical device, making it \'something you have\' — a possession factor in multi-factor authentication. Something you know is a knowledge factor like a password. Somewhere you are is a location factor. Something you are is a biometric factor.','B'],
['A company has signed an SLA with an Internet service provider. Which would BEST describe the requirements of this SLA?',['Defines the configuration of network equipment','Specifies the minimum performance guarantees','Restricts the types of traffic allowed','Describes payment terms and conditions'],1,4,'An SLA (Service Level Agreement) specifies the minimum performance standards and guarantees the service provider commits to deliver, such as uptime percentage and response times. It does not typically define equipment configuration, restrict traffic types, or describe payment terms exclusively.','B'],
['A security administrator attends an annual industry convention with other security professionals from around the world. Which attack would be MOST likely in this situation?',['Smishing','Supply chain','SQL injection','Watering hole'],3,1,'A watering hole attack compromises websites or resources that a specific group of targets is known to visit. Attackers targeting security professionals would compromise websites or resources those professionals frequent, like industry convention websites or security tool download sites.','B'],
['A security administrator attends a convention and returns to find that an attacker has identified devices on the corporate network with username \'admin\' and password \'admin\'. Which describes this situation?',['Open service ports','Default credentials','Unsupported systems','Phishing'],1,1,'Default credentials are the pre-configured username/password combinations that come with devices out of the box. Using \'admin/admin\' or similar defaults represents a failure to change these credentials. This is a common vulnerability exploited by attackers scanning for unchanged defaults.','B'],
['A finance company is legally required to maintain seven years of tax records for all customers. Which would be the BEST way to implement this requirement?',['Automate a script to remove all tax info more than seven years old','Print and store all tax records in a seven-year cycle','Allow users to download tax records from their account login','Create a separate daily backup archive for all applicable tax records'],3,4,'Creating a separate daily backup archive ensures tax records are systematically retained and protected for the required seven-year period. Automating deletion is the opposite of retention. Printing records is inefficient and doesn\'t ensure digital availability. Allowing user downloads doesn\'t ensure retention or security.','C'],
['A system administrator is designing a data center for a new public cloud and would like to automatically rotate encryption keys on a regular basis. Which provides this functionality?',['TPM','Key management system','Secure enclave','XDR'],1,0,'A Key Management System (KMS) is specifically designed to manage the lifecycle of cryptographic keys, including automated key rotation on a scheduled basis. A TPM is a chip for device-specific key storage. A secure enclave is a protected execution environment. XDR is an extended detection and response platform.','C'],
['A newly installed IPS is flagging a legitimate corporate application as malicious network traffic. Which would be the BEST way to resolve this issue?',['Disable the IPS signature','Block the application','Log all IPS events','Tune the IPS alerts'],3,0,'Tuning the IPS alerts (adjusting the configuration to reduce false positives) allows the legitimate application to pass while maintaining security against actual threats. Disabling the signature removes protection entirely. Blocking the application would disrupt business. Simply logging events doesn\'t fix the false positive.','C'],
['A security administrator has identified an internally developed application which allows modification of SQL queries through the web-based front-end. Which changes would resolve this vulnerability?',['Store all credentials as salted hashes','Verify the application digital signature','Validate all application input','Obfuscate the application source code'],2,1,'Validating all application input (input validation and parameterized queries/prepared statements) prevents SQL injection by ensuring user input cannot modify the SQL query structure. Salting hashes protects stored passwords but doesn\'t prevent SQL injection. Digital signatures verify integrity. Obfuscation hides code but doesn\'t fix the vulnerability.','C'],
['A system administrator is implementing a fingerprint scanner to provide access to the data center. Which authentication technology is associated with this access?',['Digital signature','Hard authentication token','Security key','Something you are'],3,0,'A fingerprint scanner is a biometric authentication method, which falls under the \'something you are\' category of authentication factors. Digital signatures are cryptographic. Hard authentication tokens are \'something you have\'. Security keys are hardware tokens that are \'something you have\'.','C'],
['The IT department maintains an on-site inventory of switch interface cards. If a failure occurs, the on-site technician can replace the card and have the system running again in sixty minutes. Which BEST describes this recovery metric?',['MTBF','MTTR','RPO','RTO'],1,3,'MTTR (Mean Time To Repair) describes the average time required to repair a failed component and return the system to operation. The sixty-minute repair time is the MTTR for this scenario. MTBF is how long hardware operates between failures. RPO is data loss tolerance. RTO is the target time to restore services.','C'],
['A company maintains a server farm in a large data center accessible only from inside. A group of servers was breached before patches were applied, but breach attempts were not logged on other servers. Which threat actor would be MOST likely?',['Organized crime','Insider','Nation state','Unskilled attacker'],1,1,'An insider threat (current or former employee with legitimate access) is most likely when servers are only accessible from inside the data center and the breach targeted specific servers. External threat actors would not have direct internal access. The selective nature of the breach also suggests inside knowledge of which servers to target.','C'],
['An organization received a vulnerability scan report showing Sun JRE vulnerabilities on web servers, but the server administrator verified JRE is not installed. Which would be the BEST way to handle this?',['Install the latest version of JRE on the server','Quarantine the server and scan for malware','Harden the OS of the web server','Ignore the JRE vulnerability alert'],3,3,'A false positive in a vulnerability scan report that references software not installed on the system should be investigated and then documented. The appropriate action is to verify the software is truly not installed, document the finding as a false positive, and then ignore/suppress the alert in future reports. Installing JRE would create a real vulnerability.','C'],
['A user downloaded a file compression utility. Immediately after installing, overall workstation performance degraded and tasks now take twice as long. Which BEST describes this malware infection?',['Ransomware','Bloatware','Logic bomb','Trojan'],3,1,'A Trojan (Trojan horse) is malware disguised as legitimate software. The user installed what appeared to be a compression utility but it was actually malware that degraded system performance. Ransomware encrypts files and demands payment. Bloatware is unwanted pre-installed software. A logic bomb executes when specific conditions are met.','C'],
['Which is the process for replacing sensitive data with a non-sensitive and functional placeholder?',['Steganography','Tokenization','Retention','Masking'],1,0,'Tokenization replaces sensitive data with a non-sensitive functional substitute (token) that maintains the format and usability of the original data while protecting the actual sensitive information. Steganography hides data within other media. Retention defines how long data is kept. Masking displays only part of the data.','C'],
['A security administrator installed a new firewall to protect a web server VLAN. The application owner requires all web server sessions communicate over an encrypted channel. Which firewall rule should be included?',['Source: ANY, Dest: ANY, Protocol: TCP, Port: 23, Deny','Source: ANY, Dest: ANY, Protocol: TCP, Port: 22, Allow','Source: ANY, Dest: ANY, Protocol: TCP, Port: 80, Allow','Source: ANY, Dest: ANY, Protocol: TCP, Port: 443, Allow'],3,2,'Port 443 is the standard HTTPS port for encrypted web traffic over TLS. To ensure all web server sessions use encrypted channels, the firewall should allow traffic on port 443. Port 23 is Telnet (unencrypted). Port 22 is SSH (for server administration, not web traffic). Port 80 is HTTP (unencrypted web traffic).','C'],
['Which of these would be used to provide multi-factor authentication?',['USB-connected storage drive with FDE','Employee policy manual','Just-in-time permissions','Smart card with picture ID'],3,0,'A smart card with picture ID combines \'something you have\' (the smart card) with \'something you are\' (biometric facial recognition via the photo ID). This constitutes multi-factor authentication. A USB storage drive with FDE is single factor. An employee policy manual is not authentication. Just-in-time permissions are an access control concept.','C'],
['A company network team has been asked to build an IPsec tunnel to a new business partner. Which security risk would be the MOST important to consider?',['Supply chain attack','Unsupported systems','Business email compromise','Typosquatting'],0,2,'When establishing an IPsec tunnel to a business partner, a supply chain attack is the most critical concern. The partner\'s systems could be compromised, and the encrypted tunnel could provide attackers direct access to internal networks. Unsupported systems, BEC, and typosquatting are concerns but not specific to building IPsec tunnels to partners.','C'],
['A company HR team maintains a list of employees in corporate savings plan. A third-party financial company uses this information to manage stock investments for the employees. Which describes this financial company?',['Processor','Owner','Controller','Custodian'],0,3,'A data processor processes personal data on behalf of and under the instructions of the data controller. The financial company processes the employee investment data at the direction of the company. The data owner has business responsibility. The controller determines purposes. The custodian manages data protection.','C'],
['A technology company is manufacturing a military-grade radar tracking system that can instantly identify any nearby UAVs. The UAV detector must instantly identify and react to a vehicle without delay. Which BEST describes this tracking system?',['RTOS','IoT','ICS','SDN'],0,2,'An RTOS (Real-Time Operating System) is specifically designed for applications that must respond to events within strict guaranteed time constraints. The requirement for instant identification and reaction without delay is the defining characteristic of RTOS applications. IoT describes connected devices. ICS controls industrial processes. SDN is a networking architecture.','C'],
['During a ransomware outbreak, an organization was forced to rebuild database servers from known good backup systems. In which incident response phase were these servers brought back online?',['Recovery','Lessons learned','Containment','Detection'],0,1,'The Recovery phase of incident response is where affected systems are restored to normal operation. Rebuilding database servers from backups and bringing them back online represents the recovery phase. Lessons learned analyzes the incident after recovery. Containment limits the spread. Detection identifies that an incident has occurred.','C'],
['A security administrator is installing a web server with a newly built operating system. Which would be the best way to harden this OS?',['Create a backup schedule','Install a device certificate','Remove unnecessary software','Disable power management features'],2,2,'Removing unnecessary software is a fundamental OS hardening technique. It reduces the attack surface by eliminating software that could be vulnerable to exploitation. Creating a backup schedule protects data but doesn\'t harden the OS. A device certificate provides authentication. Disabling power management is an operational concern.','C'],
['A network IPS created a log entry showing: \'SELECT * FROM users WHERE username=x OR x=x AND password=x OR x=x\'. Which describes this log entry?',['Phishing','Brute force','SQL injection','Cross-site scripting'],2,1,'SQL injection is clearly visible in the log entry. The query attempts to bypass authentication using \'OR x=x\' which always evaluates to true, allowing access without valid credentials. The SQL query syntax in the application data is the definitive indicator of a SQL injection attempt. Phishing is email-based. Brute force tries many passwords. XSS injects JavaScript.','C'],
['An incident response team would like to validate disaster recovery plans without making any changes to the infrastructure. Which would be the best course of action?',['Tabletop exercise','Hot site fail-over','Simulation','Penetration test'],0,4,'A tabletop exercise is a discussion-based session where participants talk through response procedures without actually executing them or changing the infrastructure. Hot site fail-over tests actual systems. A simulation may involve some system changes. A penetration test actively attempts to exploit vulnerabilities.','C'],
['Each year, a certain number of laptops are lost or stolen and must be replaced. Which would describe the total cost the company spends each year on laptop replacements?',['SLE','SLA','ALE','ARO'],2,4,'ALE (Annual Loss Expectancy) represents the total expected annual cost from a specific risk. It\'s calculated as SLE (cost of one lost laptop) x ARO (number of laptops lost per year). The total annual replacement cost is the ALE. SLE is the single event cost. SLA is a service agreement. ARO is the rate of occurrence.','C'],
['A security administrator installed a new firewall between the corporate user network and data center. When turned on with default settings, users complain the data center application no longer works. Which would be the BEST way to correct this?',['Create a single firewall rule with an explicit deny','Build a separate VLAN for the application','Create firewall rules that match the application traffic flow','Enable firewall threat blocking'],2,2,'Creating specific firewall rules that allow the required application traffic while blocking other traffic is the correct approach. Default-deny firewalls block all traffic until explicitly permitted. Rules should be created to permit the specific ports and protocols the application requires. A single deny rule would block traffic. A VLAN separation doesn\'t fix the firewall rules.','C'],
['A security administrator is installing a new web application that will be available to the public. Which would provide the BEST protection against application-level attacks?',['IPS','Firewall','WAF','SIEM'],2,2,'A WAF (Web Application Firewall) specifically protects web applications by inspecting HTTP/HTTPS traffic and blocking application-layer attacks like SQL injection, XSS, and CSRF. An IPS monitors for network-level attacks. A traditional firewall works at network/transport layers. A SIEM aggregates and correlates logs but doesn\'t actively block attacks.','C'],
['Which of the following would BEST describe the estimated number of laptops that might be stolen in a fiscal year?',['ALE (Annual Loss Expectancy)','SLE (Single Loss Expectancy)','ARO (Annual Rate of Occurrence)','MTTR (Mean Time To Repair)'],2,4,'ARO (Annual Rate of Occurrence) describes how often a specific risk event is expected to happen in one year. The number of laptops expected to be stolen annually is an ARO. ALE = SLE x ARO. SLE is the loss from a single event. MTTR is a hardware repair metric.','Custom'],
['A company must meet a compliance requirement that backups must be recoverable and no more than 4 hours old at any time. Which metric defines this requirement?',['RTO','MTD','MTTF','RPO'],3,4,'RPO (Recovery Point Objective) defines the maximum acceptable age of recoverable data. A 4-hour RPO means backups must occur at least every 4 hours. RTO defines how quickly systems must be restored after failure. MTD is Maximum Tolerable Downtime. MTTF is Mean Time To Failure (a hardware reliability metric).','Custom'],
['A healthcare organization\'s cloud vendor will have access to patient records. Which agreement is REQUIRED by HIPAA before granting this access?',['SLA','NDA','BAA','MOA'],2,4,'HIPAA requires a Business Associate Agreement (BAA) when a vendor (business associate) will handle Protected Health Information (PHI). The BAA legally binds the vendor to HIPAA\'s PHI protection requirements. An SLA covers performance standards. An NDA covers confidentiality generally. An MOA formalizes partnerships.','Custom'],
['An employee\'s password was stolen in a phishing attack, but the attacker still cannot access the account. Which control MOST likely prevented the breach?',['Password length policy','Account lockout policy','Single Sign-On','Multi-Factor Authentication'],3,0,'MFA requires an additional factor beyond the password. Even with the stolen password, the attacker lacks the second factor (something you have or something you are). Password length policies don\'t protect stolen passwords. Account lockout doesn\'t help if the attacker has valid credentials. SSO would actually increase the damage from a stolen credential.','Custom'],
['A penetration tester was able to send forged ARP replies to a victim, causing the victim to send all traffic to the attacker\'s machine instead of the default gateway. Which attack is this?',['DNS poisoning','VLAN hopping','Session hijacking','ARP poisoning / MITM'],3,1,'ARP poisoning sends forged ARP replies to associate the attacker\'s MAC address with the gateway\'s IP address, redirecting all victim traffic through the attacker — a Layer 2 MITM attack. DNS poisoning corrupts DNS records. VLAN hopping exploits trunk port configurations. Session hijacking steals established sessions.','Custom'],
['A company stores customer credit card numbers and must comply with the specific data security standard governing payment card data. Which regulation applies?',['HIPAA','GDPR','SOX','PCI DSS'],3,4,'PCI DSS specifically governs organizations that store, process, or transmit cardholder data. HIPAA governs health information. GDPR governs EU personal data broadly. SOX governs financial reporting for public companies.','Custom'],
['A network administrator needs to authenticate remote Wi-Fi users using individual credentials (not shared) and record session accounting data. Which protocol BEST meets this need?',['TACACS+','Kerberos','LDAP','RADIUS'],3,3,'RADIUS authenticates users against a central directory for network access services (Wi-Fi, VPN) and records accounting data. TACACS+ is better for device administration (routers, switches). Kerberos handles Windows domain login. LDAP queries a directory but doesn\'t provide network access control.','Custom'],
['A company\'s audit reveals network administrators need granular command-level authorization with each specific command logged separately. Which protocol BEST supports this?',['RADIUS','Kerberos','TACACS+','LDAP'],2,3,'TACACS+ separates authentication, authorization, and accounting independently, supporting granular command-level authorization for device administration. RADIUS combines auth and authorization and doesn\'t support per-command logging. Kerberos handles domain login. LDAP queries directories.','Custom'],
['Which NIST Cybersecurity Framework function involves creating and implementing appropriate safeguards to ensure delivery of critical infrastructure services?',['Identify','Detect','Respond','Protect'],3,4,'The NIST CSF Protect function covers implementing appropriate safeguards to ensure critical services are delivered. Identify covers asset management and risk assessment. Detect covers continuous monitoring. Respond covers incident response planning and execution.','Custom'],
['A company needs to allow users to authenticate once and then access Salesforce, Workday, and ServiceNow without re-entering credentials, using XML-based assertions. Which technology enables this?',['MFA alone','SSO with SAML','OTP','LDAP alone'],1,3,'SSO with SAML allows authentication once to an Identity Provider and access to multiple Service Providers without re-authenticating. SAML passes XML-based assertions between the IdP and Service Providers. MFA adds factors but doesn\'t enable cross-app session sharing. LDAP queries a directory.','Custom'],
['After employees received phishing emails containing malware, the IR team quarantined affected machines, removed the malware, restored from backups, and documented lessons learned. What should have been done BEFORE restoring from backups?',['Preparation phase','Detection and analysis','Recovery','Eradication'],3,1,'The team went directly to Recovery (restoring from backups) before completing Eradication (completely removing the malware and all its mechanisms). Per NIST IR lifecycle, you must fully eradicate the threat before recovery to prevent immediate re-infection. The correct order is: Containment, Eradication, then Recovery.','Custom'],
['A SOC analyst notices multiple authentication failures across many different accounts from a single IP address, followed by one successful login. Which attack does this BEST describe?',['Pass-the-hash','Credential stuffing','Brute force','Password spraying'],3,1,'Password spraying tries a small number of common passwords against many accounts from one source, avoiding lockout thresholds. Brute force tries many passwords against one account. Credential stuffing uses known leaked username/password pairs. Pass-the-hash uses captured NTLM hash values.','Custom'],
];

function seededShuffle(arr,seed){const r=[...arr];let s=Math.abs(seed)|1;for(let i=r.length-1;i>0;i--){s=(s*1664525+1013904223)&0x7fffffff;const j=s%(i+1);[r[i],r[j]]=[r[j],r[i]];}return r;}
function rshuffle(a){return seededShuffle(a,Math.floor(Math.random()*999999));}
