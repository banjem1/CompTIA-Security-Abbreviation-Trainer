<div class="lbl" style="margin-bottom:8px">SELECT STUDY MODE</div><div class="grid2" style="margin-bottom:14px">
${[{m:'fc',icon:'⟳',l:'FLASHCARD',d:'Flip cards to reveal definition + real-world use. Rate recall to drive spaced repetition.',c:'#00d4ff'},{m:'ch',icon:'◈',l:'REAL-WORLD QUIZ',d:'See the abbreviation, pick its real-world function from 4 choices. No hints.',c:'#00bfa5'},{m:'ty',icon:'_',l:'TYPE IT',d:'Type the complete definition from memory. Hardest mode. Builds deep recall.',c:'#7dd3fc'},{m:'eq',icon:'?',l:'ABBR EXAM',d:`Scenario questions for each term in Set ${si+1}. New order every day.`,c:'#a78bfa'}].map(({m,icon,l,d,c})=>`<div id="sm_${m}" style="background:#0b1624;border:1px solid #1e3a5a;border-radius:8px;padding:14px;cursor:pointer"><div style="font-size:17px;margin-bottom:5px;color:${c}">${icon}</div><div class="lbl" style="color:#e8f4ff;margin-bottom:4px">${l}</div><div style="font-size:9px;color:#3d5a7a;line-height:1.7">${d}</div><div style="margin-top:8px;font-size:8px;color:${c}">START →</div></div>`).join('')}
<div id="sm_mp" style="background:#0b1624;border:1px solid #1e3a5a;border-radius:8px;padding:14px;cursor:pointer;grid-column:1/-1"><div style="display:flex;align-items:center;gap:10px"><div style="font-size:24px">📋</div><div><div class="lbl" style="color:#a78bfa;margin-bottom:3px">PROFESSOR MESSER — ALL 3 PRACTICE EXAMS · COMPTIA EXAM SIMULATION</div><div style="font-size:10px;color:#3d5a7a;line-height:1.6">${EXAMS.length} questions from Exam A + B + C + Custom scenarios · All 5 SY0-701 domains · Daily rotation · Wrong answers auto-prioritized${wq.length?` · <b style="color:#ff5252">${wq.length} in Focus List</b>`:''}</div></div></div></div>
</div>
<div class="bx" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div class="lbl">PROGRESS BY CATEGORY — ALL MODES</div>${focusCat!==null?`<button class="btn" id="clearCat" style="padding:3px 8px;font-size:8px;color:#3d5a7a;border-color:#1e3a5a;background:transparent">CLEAR FILTER</button>`:''}</div>${CATS.map((cat,ci)=>{const cc=cards.filter(x=>x.cat===ci);const cm=cc.filter(x=>x.box>=3).length;const pt=Math.round(cm/cc.length*100);const ca=catAcc(ci);const weak=ca!==null&&ca<0.6;const isFoc=focusCat===ci;return`<div id="cat_${ci}" style="display:flex;align-items:center;gap:9px;margin-bottom:7px;cursor:pointer;padding:4px 6px;border-radius:5px;background:${isFoc?CC[ci]+'12':'transparent'};border:1px solid ${isFoc?CC[ci]+'40':'transparent'}"><div style="width:2px;height:13px;background:${CC[ci]};border-radius:2px;flex-shrink:0"></div><div style="flex:1"><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-size:9px;color:${isFoc?'#e8f4ff':'#b8d0ec'}">${cat.toUpperCase()}${isFoc?' ◀':''}</span><span style="font-size:9px;color:${pt===100?'#00e676':weak?'#ff5252':'#3d5a7a'}">${cm}/${cc.length}${ca!==null?` · ${Math.round(ca*100)}%`:''}</span></div><div class="bar"><div class="barf" style="width:${pt}%;background:${pt===100?'#00e676':weak?'#ff5252':CC[ci]}"></div></div></div>${weak?`<span style="font-size:9px;color:#ff5252">⚠</span>`:''}</div>`;}).join('')}<div class="lbl" style="margin-top:6px">Click a category to prioritize its terms in study sessions</div></div>
${Object.values(qSt).some(s=>s.a>0)?`<div class="bx"><div class="lbl" style="margin-bottom:10px">COMPTIA EXAM DOMAIN PROGRESS</div>${DOMS.map((dom,di)=>{const dqs=EXAMS.filter(q=>q.dom===di);const all=dqs.map(q=>qSt[q.id]||{a:0,c:0}).filter(s=>s.a>0);if(!all.length)return'';const acc=Math.round(all.reduce((s,x)=>s+x.c/x.a,0)/all.length*100);const wc=wq.filter(q=>q.dom===di).length;const weak=acc<60;return`<div style="display:flex;align-items:center;gap:9px;margin-bottom:7px"><div style="flex:1"><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-size:9px;color:#b8d0ec">${dom}</span><span style="font-size:9px;color:${weak?'#ff5252':'#00e676'}">${acc}%${wc?` ⚠${wc}`:''}</span></div><div class="bar"><div class="barf" style="width:${acc}%;background:${weak?'#ff5252':DC[di]}"></div></div></div></div>`;}).join('')}</div>`:''}
</div></div>`;
}
// ── EVENT BINDING ─────────────────────────────────────────────
function bind(){
  on('goMenu',()=>{scr='menu';R();});on('goMenu2',()=>{mastered=false;scr='menu';R();});
  on('doFlip',()=>{flipped=true;R();});on('togEx',()=>{showEx=!showEx;R();});
  on('revDone',()=>{advance();});on('nextCh',()=>{if(!checkM())advance();});
  on('advSet',()=>{si++;mastered=false;scr='menu';save();R();});
  on('revSet',()=>{mastered=false;startMode(mode);});
  on('tyChk',chkTy);on('tyNext',()=>{recTerm(card.id,'ty',tr);if(!checkM())advance();});
  on('eqNext',()=>{eqi++;eqp=null;R();});on('mqNext',()=>{cqi++;cqp=null;R();});
  on('cqBack',()=>{cqs=[];cqp=null;R();});
  on('doAll',()=>{cqs=buildQs(null);cqi=0;cqp=null;R();});
  on('doFocus',()=>{cqs=weakQs();cqi=0;cqp=null;R();});
  on('clearCat',()=>{focusCat=null;R();});
  on('goFocus',()=>{mode='mp';scr='game';cqs=weakQs();cqi=0;cqp=null;R();});
  onq('[data-r]',e=>{const r=parseInt(e.currentTarget.dataset.r);recTerm(card.id,'fc',r>=1,r);if(!checkM())advance();});
  onq('[data-cid]',e=>{if(picked!==null)return;const id=parseInt(e.currentTarget.dataset.cid);const ok=id===card.id;picked=id;isRight=ok;recTerm(card.id,'ch',ok);if(!ok){R();setTimeout(()=>{reviewing=true;R();},600);}else R();});
  onq('[data-ei]',e=>{if(eqp!==null)return;const i=parseInt(e.currentTarget.dataset.ei);const eq=eqs[eqi%eqs.length];const ok=i===eq.ans;eqp=i;const t=TERMS.find(t=>t.abbr===eq.abbr);if(t)recTerm(t.id,'eq',ok);R();});
  onq('[data-mi]',e=>{if(cqp!==null)return;const i=parseInt(e.currentTarget.dataset.mi);const mq=cqs[cqi%cqs.length];const ok=i===mq.ans;cqp=i;recQ(mq.id,ok);R();});
  onq('[data-dom]',e=>{const di=parseInt(e.currentTarget.dataset.dom);cqs=buildQs(di);cqi=0;cqp=null;R();});
  onq('[data-m]',e=>{startMode(e.currentTarget.dataset.m);});
  onq('[id^="set_"]',e=>{si=parseInt(e.currentTarget.id.replace('set_',''));save();R();});
  onq('[data-ft]',e=>{const id=parseInt(e.currentTarget.dataset.ft);const t=cards.find(c=>c.id===id);if(t){mode='fc';scr='game';card=t;flipped=false;showEx=false;isRev=t.box>=3;R();}});
  onq('[id^="sm_"]',e=>{startMode(e.currentTarget.id.replace('sm_',''));});
  onq('[id^="cat_"]',e=>{const ci=parseInt(e.currentTarget.id.replace('cat_',''));focusCat=focusCat===ci?null:ci;R();});
  const tyi=$('tyi');if(tyi){tyi.addEventListener('input',e=>ti=e.target.value);tyi.addEventListener('keydown',e=>{if(e.key==='Enter')chkTy();});setTimeout(()=>tyi.focus(),50);}
}
function chkTy(){if(tc||!ti.trim())return;tr=ti.toLowerCase().replace(/[^a-z0-9]/g,'')===card.full.toLowerCase().replace(/[^a-z0-9]/g,'');tc=true;R();}
function advance(){const pool=curSet();if(!pool.length)return;const next=pickNext();card=next;flipped=false;showEx=false;choices=[];picked=null;isRight=null;reviewing=false;ti='';tc=false;tr=null;if(mode==='ch'){const oth=rshuffle(pool.filter(x=>x.id!==next.id)).slice(0,3);choices=rshuffle([next,...oth]);}R();}
function checkM(){if(curSet().every(c=>c.box>=3)){mastered=true;R();return true;}return false;}
function startMode(m){mode=m;stats={r:0,t:0,streak:0,best:stats.best};scr='game';if(m==='mp'){cqs=buildQs(null);cqi=0;cqp=null;R();return;}if(m==='eq'){const pool=curSet();eqs=seededShuffle(pool.map(t=>synQ(t,pool)),dateSeed());eqi=0;eqp=null;R();return;}advance();}
R();
</script></body></html>
